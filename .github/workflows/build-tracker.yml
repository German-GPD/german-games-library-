name: Build Windows tracker
on:
  push:
    branches: [main]
    paths:
      - "desktop-tracker/**"
      - ".github/workflows/build-tracker.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "German-Games-Tracker" desktop-tracker/tracker.py
      - name: Upload downloadable EXE
        uses: actions/upload-artifact@v4
        with:
          name: German-Games-Tracker-Windows
          path: dist/German-Games-Tracker.exe
          if-no-files-found: error
