name: Build Windows tracker
on:
  push:
    branches: [main]
    paths:
      - "desktop-tracker/**"
      - "js/tracker.js"
      - ".github/workflows/build-tracker.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "German-Games-Tracker" desktop-tracker/tracker.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: German-Games-Tracker-Windows
          path: dist/German-Games-Tracker.exe
          if-no-files-found: error
      - name: Publish direct download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-tracker-latest
          name: German'$ Game Tracker — latest Windows build
          body: |
            Download **German-Games-Tracker.exe** below.
            Windows desktop tracker. See the repository's desktop-tracker/README.md for privacy and usage details.
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/German-Games-Tracker.exe
