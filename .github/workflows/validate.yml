name: Validate library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/games.js
      - name: Check required files
        run: |
          test -s index.html
          test -s css/style.css
          test -s js/app.js
          test -s js/games.js
          test -s README.md
          test -s LICENSE
